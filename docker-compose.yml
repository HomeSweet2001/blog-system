version: '3.8'

# Ambiente de desenvolvimento local. Para PRODUCAO use o PostgreSQL do Render.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: blog
    ports:
      - '5432:5432'
    volumes:
      - blog-pgdata:/var/lib/postgresql/data

volumes:
  blog-pgdata:
